    stroke-width="10"
    stroke-linejoin="round"
  />
  <path d="M196 300h120l44 78a34 34 0 0 1-30 50H182a34 34 0 0 1-30-50z" fill="#ffcf70" opacity="0.92" />
  <circle cx="228" cy="372" r="13" fill="#fff" opacity="0.75" />
  <circle cx="286" cy="392" r="9" fill="#fff" opacity="0.6" />
  <circle cx="256" cy="346" r="7" fill="#fff" opacity="0.5" />
