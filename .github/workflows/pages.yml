name: Deploy to GitHub Pages

# Publishes to https://cmbeid.github.io/Projects/ — over HTTPS, which is what
# makes the game installable and lets its service worker register at all.
#
# Manual-only until Pages is enabled (Settings -> Pages -> Source: GitHub
# Actions), because the deploy step fails until then and a wall of red runs
# helps nobody. Once it is enabled, uncomment the push trigger below and this
# deploys on every change, like the S3 workflow.
on:
  workflow_dispatch:
  push:
     branches:
       - main
     paths:
       - 'alchemy-forge/**'
       - 'starseed/**'
       - 'storied/**'
       - 'fathomline/**'
       - 'simtowerweb/**'
       - 'pokefling/**'
       - 'pokedefense/**'
       - 'pokeharvest/**'
       - 'hollowdeep/**'
       - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  # Proves to Pages that the deployment came from this workflow.
  id-token: write

# Pages hosts one site per repository, so deployments must not overlap.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # One cache keyed on both lockfiles: the projects are independent but
          # they share this runner, and npm's cache is global to it.
          cache-dependency-path: |
            alchemy-forge/package-lock.json
            starseed/package-lock.json
            storied/package-lock.json
            fathomline/package-lock.json
            simtowerweb/package-lock.json
            pokefling/package-lock.json
            pokedefense/package-lock.json
            pokeharvest/package-lock.json
            hollowdeep/package-lock.json

      # Unlike the S3 workflows, this one builds every project into a single
      # site, so all of them have to pass for any of them to publish. A failure
      # here blocks the next deploy; it does not take the current one down —
      # Pages keeps serving the last successful build.
      - name: Install (alchemy-forge)
        run: npm ci
        working-directory: alchemy-forge

      - name: Validate element data
        run: npm run validate
        working-directory: alchemy-forge

      - name: Test (alchemy-forge)
        run: npm test
        working-directory: alchemy-forge

      - name: Build (alchemy-forge)
        run: npm run build
        working-directory: alchemy-forge

      - name: Install (starseed)
        run: npm ci
        working-directory: starseed

      - name: Validate content
        run: npm run validate
        working-directory: starseed

      - name: Test (starseed)
        run: npm test
        working-directory: starseed

      - name: Build (starseed)
        run: npm run build
        working-directory: starseed

      - name: Install (storied)
        run: npm ci
        working-directory: storied

      - name: Validate content
        run: npm run validate
        working-directory: storied

      - name: Test (storied)
        run: npm test
        working-directory: storied

      - name: Build (storied)
        run: npm run build
        working-directory: storied

      - name: Install (fathomline)
        run: npm ci
        working-directory: fathomline

      - name: Test (fathomline)
        run: npm test
        working-directory: fathomline

      - name: Audit content (fathomline)
        run: npm run audit
        working-directory: fathomline

      - name: Build (fathomline)
        run: npm run build
        working-directory: fathomline

      - name: Install (simtowerweb)
        run: npm ci
        working-directory: simtowerweb

      # Covers the formatters and, more usefully here, asserts that every
      # sprite OPENSKY_SOURCES names is actually vendored. A missing one is
      # otherwise a blank icon and a 404 that nothing surfaces until someone
      # looks at a screenshot.
      - name: Test (simtowerweb)
        run: npm test
        working-directory: simtowerweb

      - name: Build (simtowerweb)
        run: npm run build
        working-directory: simtowerweb

      - name: Install (pokefling)
        run: npm ci
        working-directory: pokefling

      # Includes a check that every level stands still before the first shot;
      # a tower that collapses on its own would otherwise score free points.
      - name: Test (pokefling)
        run: npm test
        working-directory: pokefling

      - name: Build (pokefling)
        run: npm run build
        working-directory: pokefling

      - name: Install (pokedefense)
        run: npm ci
        working-directory: pokedefense

      # Includes the bot clearing the first map, and a check that every
      # Pokémon has its sprite sheet and cry.
      - name: Test (pokedefense)
        run: npm test
        working-directory: pokedefense

      - name: Build (pokedefense)
        run: npm run build
        working-directory: pokedefense

      - name: Install (pokeharvest)
        run: npm ci
        working-directory: pokeharvest

      # Includes a bot playing a week on the farm with each starter, which has
      # to come out ahead: a change that breaks the core loop fails here.
      - name: Test (pokeharvest)
        run: npm test
        working-directory: pokeharvest

      - name: Build (pokeharvest)
        run: npm run build
        working-directory: pokeharvest

      - name: Install (hollowdeep)
        run: npm ci
        working-directory: hollowdeep

      - name: Validate content (hollowdeep)
        run: npm run validate
        working-directory: hollowdeep

      # Includes a bot playing six hours that has to reach the Crystal
      # Hollows and Descend once: a balance change that walls the early game
      # fails here.
      - name: Test (hollowdeep)
        run: npm test
        working-directory: hollowdeep

      - name: Build (hollowdeep)
        run: npm run build
        working-directory: hollowdeep

      # One Pages site, many projects: each gets a subdirectory, mirroring the
      # prefixes used on S3. Adding a project means building it and copying it
      # in beside the others, then giving it a card below.
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site/alchemy-forge
          cp -r alchemy-forge/dist/. _site/alchemy-forge/

          mkdir -p _site/starseed
          cp -r starseed/dist/. _site/starseed/

          mkdir -p _site/storied
          cp -r storied/dist/. _site/storied/

          mkdir -p _site/fathomline
          cp -r fathomline/dist/. _site/fathomline/

          mkdir -p _site/simtowerweb
          cp -r simtowerweb/dist/. _site/simtowerweb/

          mkdir -p _site/pokefling
          cp -r pokefling/dist/. _site/pokefling/

          mkdir -p _site/pokedefense
          cp -r pokedefense/dist/. _site/pokedefense/

          mkdir -p _site/pokeharvest
          cp -r pokeharvest/dist/. _site/pokeharvest/

          mkdir -p _site/hollowdeep
          cp -r hollowdeep/dist/. _site/hollowdeep/

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Projects</title>
              <style>
                :root { color-scheme: dark; }
                body {
                  margin: 0; min-height: 100dvh; display: grid; place-items: center;
                  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
                  background: #0d1220; color: #e8edf9;
                }
                main { padding: 32px; max-width: 32rem; }
                h1 { font-size: 20px; margin: 0 0 20px; }
                .cards { display: grid; gap: 12px; }
                a.card {
                  display: flex; align-items: center; gap: 14px;
                  padding: 16px 18px; border-radius: 14px; text-decoration: none;
                  background: #1b2540; border: 1px solid #2a3757; color: inherit;
                }
                a.card:hover { background: #243052; }
                .emoji { font-size: 30px; }
                .name { font-weight: 650; }
                .desc { font-size: 13px; color: #97a3c0; margin-top: 2px; }
              </style>
            </head>
            <body>
              <main>
                <h1>Projects</h1>
                <div class="cards">
                  <a class="card" href="./alchemy-forge/">
                    <span class="emoji" aria-hidden="true">⚗️</span>
                    <span>
                      <span class="name">Alchemy Forge</span>
                      <span class="desc">Combine elements to discover 495 of them. Installs and plays offline.</span>
                    </span>
                  </a>
                  <a class="card" href="./starseed/">
                    <span class="emoji" aria-hidden="true">🛰️</span>
                    <span>
                      <span class="name">Starseed</span>
                      <span class="desc">An idle game about a self-replicating space probe. One asteroid, eventually a galaxy.</span>
                    </span>
                  </a>
                  <a class="card" href="./storied/">
                    <span class="emoji" aria-hidden="true">📖</span>
                    <span>
                      <span class="name">Storied</span>
                      <span class="desc">A phone-first reader for branching stories, driven entirely by JSON content.</span>
                    </span>
                  </a>
                  <a class="card" href="./fathomline/">
                    <span class="emoji" aria-hidden="true">🎣</span>
                    <span>
                      <span class="name">Fathomline</span>
                      <span class="desc">A casual idle fishing game. Early build — core loop and idle engine only so far.</span>
                    </span>
                  </a>
                  <a class="card" href="./simtowerweb/">
                    <span class="emoji" aria-hidden="true">🛗</span>
                    <span>
                      <span class="name">SimTowerWeb</span>
                      <span class="desc">A playable SimTower remake — elevators, tenants, star ratings. Ships community art; point it at your own SIMTOWER.EXE for the original sprites.</span>
                    </span>
                  </a>
                  <a class="card" href="./pokefling/">
                    <span class="emoji" aria-hidden="true">🎯</span>
                    <span>
                      <span class="name">PokéFling</span>
                      <span class="desc">Fling Pokémon from a slingshot through sixty levels of Kanto and Johto. Best in landscape.</span>
                    </span>
                  </a>
                  <a class="card" href="./pokedefense/">
                    <span class="emoji" aria-hidden="true">🛡️</span>
                    <span>
                      <span class="name">PokéDefense</span>
                      <span class="desc">Tower defense from Kanto to Paldea and beyond: evolve your Pokémon, catch legends, Mega Evolve, Dynamax, Terastallize, beat twelve Leagues and the Battle Frontier.</span>
                    </span>
                  </a>
                  <a class="card" href="./pokeharvest/">
                    <span class="emoji" aria-hidden="true">🌱</span>
                    <span>
                      <span class="name">PokéHarvest</span>
                      <span class="desc">A Pokémon farming game for the phone: till, plant, water and ship berries while your starter Pokémon lends a hand. Early build: the core farming loop.</span>
                    </span>
                  </a>
                  <a class="card" href="./hollowdeep/">
                    <span class="emoji" aria-hidden="true">⛏️</span>
                    <span>
                      <span class="name">Hollowdeep</span>
                      <span class="desc">An incremental mining game: dig through five eerie biomes, level your miner, craft gear, and listen to the dark.</span>
                    </span>
                  </a>
                </div>
              </main>
            </body>
          </html>
          HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
